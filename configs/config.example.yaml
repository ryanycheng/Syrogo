listeners:
  - name: "public-http"
    listen: ":23234"
    inbounds:
      - "openai-entry"
      - "responses-entry"
      - "anthropic-entry"

clients:
  # Top-level Clients own name, token, quota, and global Usage identity.
  - name: "office-key"
    token: "${SYROGO_OPENAI_CLIENT_TOKEN}"
    # Optional typed Client quota. Each window has exactly one type and matching max field.
    # Requests count at entry. Tokens/cost count after successful terminal usage, so concurrent
    # requests may overshoot and the next request gets 429. Cost uses Syrogo pricing, not a
    # Provider bill; unpriced models count as $0 and produce a runtime warning.
    # A legacy window without type remains compatible when max_requests is set.
    # quota:
    #   enabled: true
    #   windows:
    #     - name: "hourly-requests"
    #       type: "requests"
    #       duration: "1h"
    #       max_requests: 1000
    #     - name: "daily-tokens"
    #       type: "tokens"
    #       duration: "24h"
    #       max_tokens: 1000000
    #     - name: "monthly-cost"
    #       type: "cost"
    #       duration: "720h"
    #       max_cost_usd: 25
  - name: "mobile-key"
    token: "${SYROGO_MOBILE_CLIENT_TOKEN}"
  - name: "responses-key"
    token: "${SYROGO_RESPONSES_CLIENT_TOKEN}"
  - name: "anthropic-key"
    token: "${SYROGO_ANTHROPIC_CLIENT_TOKEN}"

inbounds:
  # Inbound clients are bindings only: ref selects a top-level Client, tag selects routing.
  # A tag referenced by routing.rules[].from_tags cannot lose its last Client binding source.
  # Before removing/retagging it, either add another binding with that tag or remove/change the
  # tag in every referencing route's from_tags; the structured Admin error lists those routes.
  # The same ref may be bound to multiple Inbounds; quota and Usage remain global by Client name.
  - name: "openai-entry"
    protocol: "openai_chat"
    path: "/v1/chat/completions"
    clients:
      - ref: "office-key"
        tag: "office"
      - ref: "mobile-key"
        tag: "mobile"

  - name: "responses-entry"
    protocol: "openai_responses"
    path: "/v1/responses"
    clients:
      - ref: "responses-key"
        tag: "responses"

  - name: "anthropic-entry"
    protocol: "anthropic_messages"
    path: "/v1/messages"
    clients:
      - ref: "anthropic-key"
        tag: "anthropic-to-responses"

routing:
  rules:
    - name: "office-route"
      from_tags:
        - "office"
      to_tags:
        - "openai-primary"
        - "openai-backup"
      strategy: "failover"
      target_model: "gpt-4o-mini"

    - name: "mobile-route"
      from_tags:
        - "mobile"
      to_tags:
        - "openai-primary"
        - "openai-backup"
      strategy: "weighted_round_robin"
      weights:
        openai-primary: 3
        openai-backup: 1

    - name: "responses-route"
      from_tags:
        - "responses"
      to_tags:
        - "responses-primary"
      strategy: "failover"
      # Optional per-route model mapping. Use this instead of target_model when one route
      # accepts multiple source model names and maps them to upstream-specific names.
      # model_map:
      #   gpt-4: "gpt-4o-mini"
      #   claude-sonnet-4-6: "gpt-5.4"

    # Rules are evaluated in order; the first rule whose from_tags and optional match.models
    # both match wins. match.models sees only the client's original requested model. Patterns
    # are full-string, case-sensitive, and support only * as a wildcard. It does not inspect
    # agent/Plan mode, prompts, messages, tools, or tool results.
    - name: "anthropic-haiku-to-responses"
      from_tags:
        - "anthropic-to-responses"
      match:
        models:
          - "claude-*-haiku-*"
      to_tags:
        - "responses-primary"
      strategy: "failover"
      target_model: "gpt-5.4-mini"

    - name: "anthropic-sonnet-to-responses"
      from_tags:
        - "anthropic-to-responses"
      match:
        models:
          - "claude-*-sonnet-*"
      to_tags:
        - "responses-primary"
      strategy: "failover"
      target_model: "gpt-5.4"

    - name: "anthropic-opus-to-responses"
      from_tags:
        - "anthropic-to-responses"
      match:
        models:
          - "claude-*-opus-*"
      to_tags:
        - "responses-primary"
      strategy: "failover"
      target_model: "gpt-5.4-pro"

    # Keep an unconditional rule last as the bootstrap-compatible fallback. Unknown models do
    # not automatically downgrade; they reach this rule only because it has no match block.
    - name: "anthropic-to-responses-route"
      from_tags:
        - "anthropic-to-responses"
      to_tags:
        - "responses-primary"
      strategy: "failover"
      target_model: "gpt-5.4"

outbounds:
  - name: "mock"
    protocol: "mock"
    tag: "mock-primary"

  - name: "openai-primary"
    protocol: "openai_chat"
    endpoint: "https://api.openai.com/v1"
    auth_token: "${OPENAI_API_KEY_PRIMARY}"
    tag: "openai-primary"
    # Optional provider model allowlist. Empty or omitted means unrestricted.
    # name is the canonical upstream model; aliases are accepted routed names
    # that resolve to that canonical name for this provider only.
    # Route target_model/model_map is applied first. Each fallback provider then
    # independently resolves that routed model against its own models list.
    models:
      - name: "gpt-4o-mini"
        aliases:
          - "gpt-4-mini"
          - "fast"
    # Optional per-outbound proxy. This only affects this outbound, not other providers.
    # proxy:
    #   url: "http://127.0.0.1:7890"
    # Optional outbound-only quota tracker for upstream subscription limits.
    # Provider quota supports requests and tokens together, but not Client type: cost/max_cost_usd.
    # Keep disabled/commented until values match the real upstream contract.
    # Requests and outbound tokens can be limited together; any exhausted dimension/window skips this outbound.
    # quota:
    #   enabled: true
    #   cooldown: "10m"
    #   probe_interval: "1m"
    #   windows:
    #     - name: "rolling-five-hour"
    #       reset: "rolling"
    #       duration: "5h"
    #       max_requests: 1000
    #       max_tokens: 2000000
    #     - name: "fixed-five-hour"
    #       reset: "fixed"
    #       duration: "5h"
    #       fixed:
    #         period: "interval"
    #         anchor: "2026-01-01T00:00:00Z"
    #       max_tokens: 2500000
    #     - name: "daily"
    #       reset: "fixed"
    #       fixed:
    #         period: "daily"
    #         time: "04:00"
    #         timezone: "America/New_York"
    #       max_requests: 5000
    #     - name: "weekly"
    #       reset: "fixed"
    #       fixed:
    #         period: "weekly"
    #         weekday: "monday"
    #         time: "00:00"
    #         timezone: "UTC"
    #       max_requests: 20000
    #       max_tokens: 40000000
    #   reset_all:
    #     enabled: true
    #     schedule:
    #       period: "weekly"
    #       weekday: "sunday"
    #       time: "00:00"
    #       timezone: "UTC"
    # Optional platform-side usage fallback when the upstream omits usage.
    # This is a heuristic estimate, not the provider billing truth.
    # capabilities:
    #   usage_estimation: true
    #   usage_estimation_mode: "heuristic"

  - name: "openai-backup"
    protocol: "openai_chat"
    endpoint: "https://api.openai.com/v1"
    auth_token: "${OPENAI_API_KEY_BACKUP}"
    tag: "openai-backup"

  - name: "responses-primary"
    protocol: "openai_responses"
    endpoint: "https://api.openai.com/v1"
    auth_token: "${OPENAI_RESPONSES_API_KEY_PRIMARY}"
    tag: "responses-primary"
    # Optional provider-specific Responses compatibility overrides.
    # Use this when the upstream is only partially compatible with the official Responses API.
    # Disabled capabilities are rejected or rewritten by the provider compatibility layer.
    # capabilities:
    #   responses_previous_response_id: false
    #   responses_builtin_tools: false
    #   responses_tool_result_status_error: false
    #   responses_assistant_history_native: false

  - name: "anthropic-primary"
    protocol: "anthropic_messages"
    endpoint: "https://example-anthropic-compatible.local/v1"
    auth_token: "${ANTHROPIC_API_KEY_PRIMARY}"
    tag: "anthropic-primary"
    # Optional platform-side usage fallback when the upstream omits usage.
    # This is a heuristic estimate, not the provider billing truth.
    # capabilities:
    #   usage_estimation: true
    #   usage_estimation_mode: "heuristic"

sessions:
  snapshot:
    enabled: true
    dir: "./data/sessions"
    flush_interval: "5s"

governance:
  quota:
    snapshot:
      enabled: true
      dir: "./tmp/quota"
      flush_interval: "5s"
    events:
      enabled: true
      max_entries: 200

admin:
  enabled: true
  token: "${SYROGO_ADMIN_UI_TOKEN}"
  logs:
    enabled: true
    path: "./tmp/dev.log"
    max_bytes: 65536
    rotation:
      max_size_mb: 100
      max_files: 20
      max_age_days: 14
      max_total_size_mb: 1024
      compress: true

accounting:
  enabled: true
  backend: "local_file"
  expose_http: true
  # Use /stats/usage with group_by=key, provider, model, inbound, source, outbound, error_kind, date, agent, or session.
  # error_kind helps distinguish quota, timeout, upstream 5xx, auth, and capability failures.
  admin_token: "${SYROGO_ACCOUNTING_ADMIN_TOKEN}"
  # Optional custom model pricing overrides the built-in defaults used for cost_usd.
  pricing:
    - provider: "openai"
      model: "gpt-4o-mini"
      input_per_million_usd: 0.15
      output_per_million_usd: 0.60
      cache_create_per_million_usd: 0
      cache_read_per_million_usd: 0.075
  local_file:
    dir: "./tmp/accounting"
    rotate_max_size_mb: 64
    retention_days: 30
    snapshot_retention_days: 30
    write_buffer_records: 128
    flush_interval: "2s"
    queue_size: 4096
